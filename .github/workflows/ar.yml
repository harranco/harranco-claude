name: harranco-ar
on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harranco
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: arrange files
        run: mkdir -p harranco && mv __init__.py buffer.py config.py llm.py publish.py render.py run.py tts.py harranco/
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m harranco.run ar
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: save state
        run: |
          git config user.name harranco-bot
          git config user.email bot@users.noreply.github.com
          git add state/topics.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase --autostash && git push)
